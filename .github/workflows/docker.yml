name: docker

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Computes the lowercased image name, the tags, and the pinned pi agent-config
  # ref. The Dockerfile pins the same PI_CONFIG_REF default, so local builds and
  # CI bake the identical config snapshot.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.vars.outputs.image }}
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
      extra_tag: ${{ steps.vars.outputs.extra_tag }}
      pi_config_ref: ${{ steps.vars.outputs.pi_config_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: vars
        name: Compute image name and tags
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          PI_CONFIG_REF: 256c9e672286bb1d265a173764bcdebfda75fd1b
        run: |
          set -euo pipefail
          # GHCR requires a lowercase repository path.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "pi_config_ref=$PI_CONFIG_REF" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "extra_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "extra_tag=" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main: push by digest only, tags are applied in the merge job.
      - name: Build and push by digest
        id: build
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          build-args: |
            PI_CONFIG_REF=${{ needs.prepare.outputs.pi_config_ref }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=uipi
            org.opencontainers.image.description=Web UI harness over the pi coding agent SDK
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      # PRs (and manual runs): build locally so the image can be smoke tested. Never pushes.
      - name: Build image locally (no push)
        id: build-local
        if: github.event_name != 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          build-args: |
            PI_CONFIG_REF=${{ needs.prepare.outputs.pi_config_ref }}
          push: false
          load: true
          tags: |
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.title=uipi
            org.opencontainers.image.description=Web UI harness over the pi coding agent SDK
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Smoke test (/api/health)
        if: github.event_name != 'push'
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.sha_tag }}
        run: |
          set -uo pipefail
          docker run -d --name uipi-smoke -p 8787:8787 "$IMAGE"
          for _ in $(seq 1 15); do
            if curl -sf http://localhost:8787/api/health >/dev/null; then
              echo "health OK"
              docker rm -f uipi-smoke >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "::error::/api/health did not become ready within 30s"
          docker logs uipi-smoke || true
          docker rm -f uipi-smoke >/dev/null || true
          exit 1

      - name: Export digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-amd64
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Applies the human-readable tags to the pushed digest.
  merge:
    needs: [prepare, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push tags
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          SHA_TAG: ${{ needs.prepare.outputs.sha_tag }}
          EXTRA_TAG: ${{ needs.prepare.outputs.extra_tag }}
        run: |
          set -euo pipefail
          cd "${{ runner.temp }}/digests"
          digest=""
          for f in *; do digest="$f"; break; done
          if [ -z "$digest" ]; then echo "::error::no digest artifact found"; exit 1; fi
          tags=(-t "$IMAGE:$SHA_TAG")
          if [ -n "$EXTRA_TAG" ]; then
            tags+=(-t "$IMAGE:$EXTRA_TAG")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@sha256:$digest"
          docker buildx imagetools inspect "$IMAGE:$SHA_TAG"
